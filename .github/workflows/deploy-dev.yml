# Azure App Service デプロイ (DEV環境)
name: Deploy to Azure App Service (DEV)

on:
  push:
    branches:
      - dev/release
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: dev-283-badminton-app
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Prisma for SQL Server
        run: |
          # SQL Server用スキーマをコピー
          cp prisma/schema.sqlserver.prisma prisma/schema.prisma
          npx prisma generate

      # マイグレーションはApp Service起動時に実行される（npm start内）
      # GitHub ActionsからAzure SQL Serverへの直接接続は
      # ファイアウォールの制約があるため、ここでは実行しない

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      # デプロイ成功時のみメール通知。失敗はGitHub標準の通知に任せる。
      - name: Notify deploy success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[283-badminton-app] DEV deploy 成功"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: 283-badminton-app CI <${{ secrets.GMAIL_USER }}>
          body: |
            DEV 環境へのデプロイが完了しました。動作確認を始めてください。

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            DEV URL: https://dev-283-badminton-app-dae7h5bjbddcdnd3.japaneast-01.azurewebsites.net/

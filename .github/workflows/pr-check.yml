# PR チェック (軽量)
#
# トリガー: 任意のブランチへの pull_request
# 内容: lint + 単体テスト (coverage 付き)
#
# E2E は走らせない (DEV 環境への deploy が前提で、PR 段階では未デプロイのため)。
# マージ後の DEV パイプライン / PROD パイプラインが本物のゲート。

name: PR Check

on:
  pull_request:

env:
  NODE_VERSION: '22.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client (SQLite schema)
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

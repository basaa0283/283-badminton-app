# DEV パイプライン
#
# トリガー: dev/release への push
# 流れ:   test → deploy-dev → e2e → notify
#
# notify (メール) は全ジョブが green の時のみ発火する。
# = メールが届いた = DEV 動作確認を始めて OK。
#
# 注意:
#   - DEV の Azure SQL Database は deploy と e2e が共用するため、
#     pipeline 全体に concurrency をかけて逐次化する。
#     (push が連続しても1パイプラインずつ実行)
#   - e2e はテストデータ残骸が DEV DB に混入する可能性があるため、
#     手動動作確認とは時間をずらすこと (このパイプラインの設計目的)

name: DEV Pipeline

on:
  push:
    branches:
      - dev/release
  workflow_dispatch:

concurrency:
  group: dev-pipeline
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client (SQLite schema for unit tests)
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: dev-283-badminton-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Prisma for SQL Server
        run: |
          cp prisma/schema.sqlserver.prisma prisma/schema.prisma
          npx prisma generate

      # DEV DB のスキーマを最新に揃える。失敗したら deploy を止める。
      # 以前は App Service 起動時の `npx prisma db push` 任せだったが、
      # サイレント失敗するケースがあり、API 実行時に column missing で落ちる事象が発生したため
      # CI 側に移動した。
      - name: Apply DB schema (prisma db push)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db push --accept-data-loss

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

      - name: Deploy to Azure Web App (DEV)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Generate Prisma Client (SQL Server schema)
        run: npx prisma generate --schema=prisma/schema.sqlserver.prisma

      - name: Run Playwright tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3100
          E2E_ADMIN_USER_ID: ${{ secrets.E2E_ADMIN_USER_ID }}
          E2E_PORT: "3100"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # E2E が DEV DB に残した残骸データを掃除する。
  # e2e の成否に関わらず必ず走らせる (途中失敗時のほうが残骸が多いため)。
  # notify とは独立。cleanup の失敗は通知の成否に影響しない。
  cleanup:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (SQL Server schema)
        run: npx prisma generate --schema=prisma/schema.sqlserver.prisma

      - name: Run E2E cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_CLEANUP: "1"
        run: npx tsx scripts/e2e-cleanup.ts

  notify:
    needs: e2e
    if: success()
    runs-on: ubuntu-latest
    steps:
      # github.event.commits[*].message に各コミットの full body が入っているので、
      # ここから「日本語変更点:」「確認ポイント:」セクションを抽出して
      # メール本文用の日本語サマリーを組み立てる。
      - name: Build Japanese summary
        id: summary
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          python3 <<'PY' > /tmp/summary.txt
          import os, json, re

          raw = os.environ.get("COMMITS_JSON", "null")
          try:
              commits = json.loads(raw) or []
          except Exception:
              commits = []

          subjects = []
          ja_changes = []
          qa_points = []

          def extract_section(body, label):
              pattern = rf"(?m)^[ \t]*{re.escape(label)}[ \t]*:?[ \t]*\n((?:[ \t]*-.*\n?)+)"
              m = re.search(pattern, body)
              if not m:
                  return None
              return m.group(1).rstrip()

          for c in commits:
              sha = (c.get("id") or "")[:7]
              msg = c.get("message") or ""
              lines = msg.splitlines()
              subject = lines[0] if lines else ""
              body = "\n".join(lines[1:])
              subjects.append(f"- {sha} {subject}")

              ja = extract_section(body, "日本語変更点")
              if ja:
                  ja_changes.append(ja)
              qa = extract_section(body, "確認ポイント")
              if qa:
                  qa_points.append(qa)

          print("== このプッシュの変更点 ==")
          if ja_changes:
              print("\n".join(ja_changes))
          else:
              print("(日本語サマリーなし。コミット件名:)")
              print("\n".join(subjects) if subjects else "(コミット情報なし)")

          print()
          print("== 確認ポイント ==")
          if qa_points:
              print("\n".join(qa_points))
          else:
              print("(明示なし。ベース動線をスモークチェックしてください)")

          if commits:
              print()
              print("== 含まれるコミット ==")
              print("\n".join(subjects))
          PY
          {
            echo "body<<__END__"
            cat /tmp/summary.txt
            echo "__END__"
          } >> "$GITHUB_OUTPUT"

      - name: Notify DEV ready for QA
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[283-badminton-app] DEV 動作確認OK (test + deploy + E2E 全通過)"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: 283-badminton-app CI <${{ secrets.GMAIL_USER }}>
          body: |
            DEV パイプライン (test → deploy → e2e) が全て成功しました。
            動作確認を始めて大丈夫です。

            ${{ steps.summary.outputs.body }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            DEV URL: https://dev-283-badminton-app-dae7h5bjbddcdnd3.japaneast-01.azurewebsites.net/
